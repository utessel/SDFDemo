[font]
ttf_path = /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
em_height = 16
spread_pixels = 1.5

[output]
c_header = sdf_font.h
c_source = sdf_font.c
font_name = sdf_font

[characters]
# ASCII range (32 is space, 33-126 are printable characters)
include_ascii = true
# Additional characters, e.g. German umlauts and special symbols
extra_characters = äöüÄÖÜß°€
